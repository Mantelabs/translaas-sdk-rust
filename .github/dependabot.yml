version: 2
updates:
  # Crate dependencies (root Cargo.toml / Cargo.lock)
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'type:chore'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # GitHub Actions (CI and release workflows)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'type:chore'
    # dtolnay/rust-toolchain refs such as @1.86.0 are rustc versions, not
    # action versions. Dependabot treats them as semver and opens invalid
    # bumps (for example #50: 1.86.0 -> 1.120.0). MSRV jobs pin the compiler
    # via `with.toolchain` on @master instead.
    ignore:
      - dependency-name: 'dtolnay/rust-toolchain'
