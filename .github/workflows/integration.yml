name: Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          cache-on-failure: true

      - name: Run integration tests
        run: cargo test --features integration,service --test live_api -- --test-threads=1 --nocapture
        env:
          TRANSLAAS_API_KEY: ${{ secrets.TRANSLAAS_API_KEY }}
          TRANSLAAS_BASE_URL: ${{ secrets.TRANSLAAS_BASE_URL }}
