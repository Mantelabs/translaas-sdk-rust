[package]
name = "translaas"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/Mantelabs/translaas-sdk-rust"
description = "Official Translaas client SDK for Rust"
readme = "README.md"
keywords = ["translaas", "i18n", "localization", "sdk"]
categories = ["api-bindings", "internationalization"]

[features]
default = ["cache"]
cache = []
offline = ["cache"]
service = []
axum = ["service"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
url = "2.5.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

# MSRV note: keep `quinn-proto` at 0.11.15 in Cargo.lock — 0.11.16+ pulls `rand` 0.10
# (edition2024), which breaks `cargo` 1.80. Run `cargo update -p quinn-proto --precise 0.11.15`
# after dependency updates if MSRV CI fails.
