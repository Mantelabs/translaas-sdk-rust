[package]
name = "translaas"
version = "0.4.0-beta"
edition = "2021"
rust-version = "1.86"
license = "MIT"
authors = ["Translaas SDK Contributors"]
repository = "https://github.com/Mantelabs/translaas-sdk-rust"
homepage = "https://github.com/Mantelabs/translaas-sdk-rust"
documentation = "https://docs.rs/translaas"
description = "Official Translaas client SDK for Rust"
readme = "README.md"
keywords = ["translaas", "i18n", "localization", "sdk"]
categories = ["api-bindings", "internationalization"]
exclude = ["/.github/", "/scripts/", "/target/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["cache"]
cache = []
offline = ["cache", "dep:lru", "dep:tokio", "dep:tokio-util", "dep:zip"]
service = []
axum = ["service", "dep:axum"]
integration = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
lru = { version = "0.18", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", optional = true, features = ["time", "sync", "rt", "macros"] }
tokio-util = { version = "0.7", optional = true }
url = "2.5.2"
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["matched-path", "query"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "=0.6.4"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
http-body-util = "0.1"

[[test]]
name = "readme_quickstart"
required-features = ["service"]

[[test]]
name = "client_cache_integration_test"
required-features = ["cache"]

[[test]]
name = "cachefile_file_provider_test"
required-features = ["offline"]

[[test]]
name = "cachefile_hybrid_provider_test"
required-features = ["offline"]

[[test]]
name = "cachefile_caching_client_test"
required-features = ["offline"]

[[test]]
name = "cachefile_sync_service_test"
required-features = ["offline"]

[[test]]
name = "cachefile_zip_bundle_test"
required-features = ["offline"]

[[test]]
name = "cachefile_sync_offline_zip_test"
required-features = ["offline"]

[[test]]
name = "service_test"
required-features = ["service"]

[[test]]
name = "axum_test"
required-features = ["axum"]

[[test]]
name = "live_api"
path = "tests/integration/live_api.rs"
required-features = ["integration"]
