[package]
name = "translaas"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/Mantelabs/translaas-sdk-rust"
description = "Official Translaas client SDK for Rust"
readme = "README.md"
keywords = ["translaas", "i18n", "localization", "sdk"]
categories = ["api-bindings", "internationalization"]

[features]
default = ["cache"]
cache = []
offline = ["cache"]
service = []
axum = ["service"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
url = "2"

[dev-dependencies]
