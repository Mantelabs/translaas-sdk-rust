[package]
name = "translaas"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/Mantelabs/translaas-sdk-rust"
description = "Official Translaas client SDK for Rust"
readme = "README.md"
keywords = ["translaas", "i18n", "localization", "sdk"]
categories = ["api-bindings", "internationalization"]

[features]
default = ["cache"]
cache = []
offline = ["cache"]
service = []
axum = ["service"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
url = "2.5.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "=0.6.4"

# MSRV note: pin dev/optional stack for Cargo 1.80 — newer releases use edition2024.
#   wiremock = 0.6.4 (not 0.6.5+)
#   quinn-proto = 0.11.15 in Cargo.lock (not 0.11.16+ → rand 0.10)
#   zeroize = 1.8.1 in Cargo.lock (not 1.9+)
